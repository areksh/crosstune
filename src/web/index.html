<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="qobuz-nonce" content="__QOBUZ_NONCE__" />
    <title>qobuz-helper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <h1>qobuz-helper</h1>
        <p id="session" class="session">Connecting...</p>
      </header>

      <section class="panel">
        <h2>Playlist from artists</h2>
        <p class="hint">
          One artist per line. Each artist contributes its top tracks.
        </p>
        <label class="field">
          <span>Artists</span>
          <textarea
            id="artists"
            rows="8"
            placeholder="Portishead&#10;Massive Attack&#10;Tricky"
          ></textarea>
        </label>
        <label class="field field-inline">
          <span>Top tracks per artist</span>
          <input id="per-artist" type="number" min="1" max="100" value="10" />
        </label>
        <div class="actions">
          <button id="resolve" type="button">Preview tracks</button>
        </div>
        <p id="resolve-error" class="error" hidden></p>
      </section>

      <section id="preview" class="panel" hidden>
        <h2>Preview</h2>
        <p class="hint">
          Untick any track you do not want. <span id="selected-count"></span>
        </p>
        <div id="unresolved" class="unresolved" hidden></div>
        <div id="artist-groups"></div>

        <h3>Destination</h3>
        <div class="destination">
          <label class="radio">
            <input type="radio" name="target" value="new" checked />
            Create a new playlist
          </label>
          <div id="new-fields" class="target-fields">
            <label class="field">
              <span>Name</span>
              <input id="playlist-name" type="text" placeholder="My playlist" />
            </label>
            <label class="checkbox">
              <input id="playlist-public" type="checkbox" />
              Make it public
            </label>
          </div>

          <label class="radio">
            <input type="radio" name="target" value="existing" />
            Add to an existing playlist
          </label>
          <div id="existing-fields" class="target-fields" hidden>
            <label class="field">
              <span>Playlist</span>
              <select id="playlist-select">
                <option value="">Loading...</option>
              </select>
            </label>
          </div>
        </div>

        <div class="actions">
          <button id="commit" type="button">Create playlist</button>
        </div>
        <p id="commit-error" class="error" hidden></p>
        <p id="commit-result" class="result" hidden></p>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
